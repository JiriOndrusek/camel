apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: langchain4j-ingest-sink
  labels:
    camel.apache.org/kamelet.type: "sink"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/kamelet.group: "AI"
    camel.apache.org/provider: "Apache Software Foundation"
spec:
  definition:
    title: "LangChain4j Ingest Sink"
    description: |-
      Ingest documents into a LangChain4j EmbeddingStore: the payload is split into overlapping
      segments, embedded in batches and written to the store, each segment stamped with the
      pipeline name and the document id.

      The document id is read from the header named by `documentIdHeader` and captured before
      anything else touches the exchange. Bean references are `#bean:name` values; when
      `embeddingStore` or `embeddingModel` is not set, the single registry bean of that type is
      used.
    type: object
    properties:
      pipelineName:
        title: Pipeline Name
        description: The pipeline name, stamped on every written segment.
        type: string
        default: ingest
      documentIdHeader:
        title: Document Id Header
        description: Name of the header carrying the stable document id, such as CamelAwsS3Key
          for an S3 source or CamelKafkaKey for a Kafka one.
        type: string
        default: CamelIngestDocumentId
      maxSegmentSize:
        title: Max Segment Size
        description: Maximum size of one segment, in characters.
        type: integer
        default: 500
      maxOverlapSize:
        title: Max Overlap Size
        description: How much of the previous segment each segment repeats, in characters.
        type: integer
        default: 50
      embeddingBatchSize:
        title: Embedding Batch Size
        description: How many segments are embedded per request to the embedding model.
        type: integer
        default: 32
      maxDocumentSize:
        title: Max Document Size
        description: Maximum size of one document in characters; unset means no limit. The
          pipeline holds a document in memory whole, so set the cap when the source can
          deliver oversized payloads. An oversized document fails the exchange cleanly.
        type: integer
      documentSplitter:
        title: Document Splitter
        description: A DocumentSplitter bean replacing the default recursive splitting, as a
          `#bean:name` reference; maxSegmentSize and maxOverlapSize are then ignored.
        type: string
      embeddingStore:
        title: Embedding Store
        description: The EmbeddingStore bean to write to, as a `#bean:name` reference.
        type: string
      embeddingModel:
        title: Embedding Model
        description: The EmbeddingModel bean to embed with, as a `#bean:name` reference.
        type: string
      idempotentRepository:
        title: Idempotent Repository
        description: An IdempotentRepository bean remembering ingested document ids, as a
          `#bean:name` reference. A duplicate delivery is answered skipped, first write wins.
        type: string
  dependencies:
    - "camel:langchain4j-ingest"
    - "camel:kamelet"
  template:
    from:
      uri: "kamelet:source"
      steps:
        # captured before any further step, so a document cannot forge its own identity
        - setProperty:
            name: "CamelLangChain4jIngestDocumentId"
            simple: "${header[{{documentIdHeader}}]}"
        - to:
            uri: "langchain4j-ingest:{{pipelineName}}"
            parameters:
              maxSegmentSize: "{{maxSegmentSize}}"
              maxOverlapSize: "{{maxOverlapSize}}"
              embeddingBatchSize: "{{embeddingBatchSize}}"
              maxDocumentSize: "{{?maxDocumentSize}}"
              documentSplitter: "{{?documentSplitter}}"
              embeddingStore: "{{?embeddingStore}}"
              embeddingModel: "{{?embeddingModel}}"
              idempotentRepository: "{{?idempotentRepository}}"
