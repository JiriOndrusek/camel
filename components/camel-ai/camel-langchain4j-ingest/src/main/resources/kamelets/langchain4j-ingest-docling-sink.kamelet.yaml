apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: langchain4j-ingest-docling-sink
  labels:
    camel.apache.org/kamelet.type: "sink"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/kamelet.group: "AI"
    camel.apache.org/provider: "Apache Software Foundation"
spec:
  definition:
    title: "LangChain4j Ingest Docling Sink"
    description: |-
      Ingest documents into a LangChain4j EmbeddingStore through Docling: a Docling Serve
      instance converts each document to structure-preserving markdown (OCR included), which is
      then split into overlapping segments, embedded in batches and written to the store.

      Configure the Docling Serve address with camel.component.docling.docling-serve-url. The
      payload is pinned to bytes and the CamelDocling* control headers are swept, because none
      of them may be decided by a consumer-delivered payload.
    type: object
    properties:
      pipelineName:
        title: Pipeline Name
        description: The pipeline name, stamped on every written segment.
        type: string
        default: ingest
      documentIdHeader:
        title: Document Id Header
        description: Name of the header carrying the stable document id.
        type: string
        default: CamelIngestDocumentId
      maxSegmentSize:
        title: Max Segment Size
        description: Maximum size of one segment, in characters.
        type: integer
        default: 500
      maxOverlapSize:
        title: Max Overlap Size
        description: How much of the previous segment each segment repeats, in characters.
        type: integer
        default: 50
      embeddingBatchSize:
        title: Embedding Batch Size
        description: How many segments are embedded per request to the embedding model.
        type: integer
        default: 32
      maxDocumentSize:
        title: Max Document Size
        description: Maximum size of one document in characters, applied to the converted
          markdown; unset means no limit. The pipeline holds a document in memory whole, so
          set the cap when the source can deliver oversized payloads. An oversized document
          fails the exchange cleanly.
        type: integer
      documentSplitter:
        title: Document Splitter
        description: A DocumentSplitter bean replacing the default recursive splitting, as a
          `#bean:name` reference; maxSegmentSize and maxOverlapSize are then ignored.
        type: string
      embeddingStore:
        title: Embedding Store
        description: The EmbeddingStore bean to write to, as a `#bean:name` reference.
        type: string
      embeddingModel:
        title: Embedding Model
        description: The EmbeddingModel bean to embed with, as a `#bean:name` reference.
        type: string
      idempotentRepository:
        title: Idempotent Repository
        description: An IdempotentRepository bean remembering ingested document ids, as a
          `#bean:name` reference.
        type: string
  dependencies:
    - "camel:langchain4j-ingest"
    - "camel:docling"
    - "camel:kamelet"
  template:
    from:
      uri: "kamelet:source"
      steps:
        # captured before the parse, so a document cannot forge its own identity
        - setProperty:
            name: "CamelLangChain4jIngestDocumentId"
            simple: "${header[{{documentIdHeader}}]}"
        - convertBodyTo:
            type: "byte[]"
        - removeHeaders:
            pattern: "CamelDocling*"
        - to: "docling:convert?operation=CONVERT_TO_MARKDOWN&contentInBody=true"
        - to:
            uri: "langchain4j-ingest:{{pipelineName}}"
            parameters:
              maxSegmentSize: "{{maxSegmentSize}}"
              maxOverlapSize: "{{maxOverlapSize}}"
              embeddingBatchSize: "{{embeddingBatchSize}}"
              maxDocumentSize: "{{?maxDocumentSize}}"
              documentSplitter: "{{?documentSplitter}}"
              embeddingStore: "{{?embeddingStore}}"
              embeddingModel: "{{?embeddingModel}}"
              idempotentRepository: "{{?idempotentRepository}}"
