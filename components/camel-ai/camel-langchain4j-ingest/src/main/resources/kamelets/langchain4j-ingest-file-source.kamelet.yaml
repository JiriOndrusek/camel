apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: langchain4j-ingest-file-source
  labels:
    camel.apache.org/kamelet.type: "source"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/kamelet.group: "AI"
    camel.apache.org/provider: "Apache Software Foundation"
spec:
  definition:
    title: "LangChain4j Ingest File Source"
    description: |-
      Watch a directory as the source of an ingestion pipeline, with the defaults a knowledge
      base needs: documents are left in place (noop), unchanged files are remembered in a
      duplicate register keyed on path, modification time and size, a file still being copied
      in is waited for (readLock=changed), and the file name is exposed as the document id in
      the CamelIngestDocumentId header.
    required:
      - directory
    type: object
    properties:
      directory:
        title: Directory
        description: The directory to ingest documents from.
        type: string
      recursive:
        title: Recursive
        description: Whether subdirectories are ingested too.
        type: boolean
        default: true
  dependencies:
    - "camel:file"
    - "camel:kamelet"
  template:
    from:
      uri: "file:{{directory}}"
      parameters:
        noop: "true"
        idempotent: "true"
        # an edited file gets a new key and re-ingests
        idempotentKey: "${file:absolute.path}:${file:modified}:${file:size}"
        recursive: "{{recursive}}"
        readLock: "changed"
        charset: "UTF-8"
      steps:
        - setHeader:
            name: "CamelIngestDocumentId"
            simple: "${header.CamelFileName}"
        - to: "kamelet:sink"
